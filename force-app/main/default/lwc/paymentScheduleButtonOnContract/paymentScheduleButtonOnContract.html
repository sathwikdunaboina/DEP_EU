<template>
    <lightning-card title="Payment Schedule">
        <template if:true={showSection}>
            <p class="slds-p-horizontal_small">You Are About To Get Payment Schedule Data for <b>{customerName}</b> for <b>{contractName}</b> Contract  with VIN Number :<b>{contractVinNumber}</b> </p>
            <p class="slds-p-horizontal_small slds-m-top_small">
                Please Make Sure The <b>Customer Number, Vin Number Are Correct </b>In Order To Get Correct Data.
            </p>

            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-button
                    label="Proceed"
                    variant="brand"
                    onclick={handleProceed}
                    class="slds-m-right_small"
                ></lightning-button>
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCancel}
                ></lightning-button>
            </div>
        </template>

        <template if:false={showSection}>
            <p class="slds-p-horizontal_small slds-text-color_error">
                <b>Customer Number and VIN Should Be Pressent To Run The Report !</b>
            </p>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-button
                    label="Close"
                    variant="neutral"
                    onclick={handleCancel}
                ></lightning-button>
            </div>
        </template>
    </lightning-card>
</template>
