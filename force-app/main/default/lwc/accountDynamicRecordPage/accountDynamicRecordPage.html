<template>
<div class="slds-grid slds-wrap">
<div class="slds-col slds-size_1-of-2">
    <lightning-combobox
    label="Country"
    value={selectCountryValue}
    options={CountryPicklistOptions}
    onchange={handleCountrySelect}>>
</lightning-combobox>
    <lightning-input-address
        class="lightningInputAddress"
        address-label="Billing Address"
        readonly = {isReadOnly} 
        country-label="Billing Country"
        street-label="Billing Street"
        city-label="Billing City"
        province-label="Billing State/Province"
        postal-code-label="Billing Zip/PostalCode"
        country={billingAddress.country}
        street={billingAddress.street}
        city={billingAddress.city}
        province={billingAddress.province}
        postal-code={billingAddress.postalCode}
        data-id="billingAddress"
        onchange={handleAddressChange}
        onerror={handleError} 
        locale="en-US"
        show-address-lookup
        country-lookup-filter={selectCountryFilter}
        required-fields="Country">
    </lightning-input-address>
    </div>
        <div class="slds-grid slds-wrap slds-m-top_medium full-row-background">
    <div class="slds-col slds-size_1-of-2">
    <strong class="map-title">Map Location</strong>
    <lightning-map
        map-markers={mapMarkers}
        zoom-level="15"
        center={mapCenter}
        list-view="hidden">
    </lightning-map>
</div>
</div>
</div>     
<template if:true={showDuplicateModal}>
<div class="slds-box slds-theme_warning slds-p-around_x-small slds-m-around_x-small" style="max-width: 400px;" role="alert">
<div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
    <div class="slds-grid slds-grid_vertical-align-center">
        <lightning-icon icon-name="utility:warning" variant="warning" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
        <span class="slds-text-body_small">{duplicateHeaderMessage}</span>
    </div>
    <button class="slds-button slds-button_icon slds-button_icon-small" title="Close" onclick={handleCloseAlert}>
        <lightning-icon icon-name="utility:close" alternative-text="Close" size="xx-small"></lightning-icon>
        <span class="slds-assistive-text">Close</span>
    </button>
</div>
<div class="slds-m-top_x-small slds-text-body_small">
    <p>This record looks like an existing record.<br />
        Check potential duplicates before saving.</p>
    <a href="#" onclick={handleViewDuplicates}>View Duplicates</a>
</div>
</div>
</template>

<template if:true={showDuplicateAlert}>
<div class="slds-modal slds-modal_large slds-fade-in-open">
<div class="slds-modal__container">
    <header class="slds-modal__header slds-theme_shade">
    <h2><strong>View Duplicates</strong></h2>
    </header>
    <div class="slds-modal__content slds-p-around_medium">
                <p>Use one of these records?</p>
                <template if:true={duplicateAccounts}>
                    <p> Total duplicates:{duplicateAccounts.length}</p>
                    
<br />

                </template>
            <template for:each={duplicateAccounts} for:item="acc">
            <div key={acc.Id} class="slds-box slds-m-bottom_small">
                <p><strong>Account Name:</strong> {acc.Name}</p>
                <p><strong>Customer ID:</strong> {acc.CustomerID__c}</p>
                <p><strong>Customer Number (CMS ID):</strong> {acc.Customer_Number__c}</p>
                <p><strong>Phone:</strong> {acc.Phone}</p>
                <p><strong>Account Owner Alias:</strong> {acc.Owner.Alias}</p>
                <p><strong>Billing Street:</strong> {acc.BillingStreet}</p>
                <p><strong>Billing City:</strong> {acc.BillingCity}</p>
                <p><strong>Billing State/province:</strong> {acc.BillingState}</p>
                <p><strong>Billing Zip/Postal Code:</strong> {acc.BillingPostalCode}</p>
                <p><strong>Billing Country:</strong> {acc.BillingCountry}</p>
                <button data-id={acc.Id} onclick={handleOpenRecord}>Open This Account</button>
            </div>
        </template>
    </div>
    <footer class="slds-modal__footer">
        <button onclick={handleCancel}>Close</button>
    </footer>
</div>
</div>
</template>

<div if:true={showSaveButton} class="slds-m-top_medium">
<div class="slds-m-top_medium">
<lightning-button label="Save" variant="brand" onclick={handleSave}></lightning-button> &nbsp;
</div>
</div>  
</template>
