<template>
    <lightning-quick-action-panel header="Quote Creations">
        <lightning-record-edit-form record-id={recordId} object-api-name={objectApiName} onsuccess={handleSuccess}>
            <table>
                <thead if:false={isLoaded}>
                    <tr>
                        <th style="width:5%;"></th>
                        <th style="width:25%;">Name</th>
                        <th style="width:10%;">Quote Id</th>
                        <th style="width:10%;">Amount</th>
                        <th style="width:10%;">Brand</th>
                        <th style="width:20%;">Dealer Name</th>
                        <th style="width:10%;">Dealer Delivery Date</th>
                        <th style="width:10%;">Closed Date</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={data} for:item="item" if:false={isLoaded}>
                        <tr key={item.Id} style="border-bottom: 1px solid #ddd;">
                            <td style="width: 5%;">
                                <template if:true={item.checkbox}>
                                    <lightning-input style="color:blue;" type="checkbox" data-amount={item.Amount} name={item.Id} value={item.Id}>
                                    </lightning-input>
                                </template>
                            </td>
                            <td style="width:25%;text-overflow:ellipsis;">{item.Name}</td>
                            <td style="width:10%;text-overflow:ellipsis;">{item.Quote_Id__c}</td>
                            <td style="width:10%;text-overflow:ellipsis;">
                                <lightning-formatted-number value={item.Amount} format-style="currency" currency-code={item.CurrencyIsoCode}>
                                </lightning-formatted-number>
                            </td>
                            <td style="width:10%;text-overflow:ellipsis;">{item.Brand__c}</td>
                            <td style="width:20%;text-overflow:ellipsis;">{item.Dealer_Name__c}</td>
                            <td style="width:10%;text-overflow:ellipsis;">{item.Dealer_Delivery_Date__c}</td>
                            <td style="width:10%;text-overflow:ellipsis;">{item.CloseDate}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <div if:true={isLoaded} class="slds-is-relative" style="padding: bottom 10%;margin-top: 45px;margin-bottom: 45px;">
                
                <div class="spin-container">
                    <div class="spin loader" id="loader"></div>
                    <div class="spin loader2" id="loader2"></div>
                    <div class="spin loader3" id="loader3"></div>
                    <div class="spin loader4" id="loader4"></div>
                    <span class="text">Thank you for your patience {currentUserName}! Quote creation is in progress...</span>
                  </div>
            </div>
        </lightning-record-edit-form>
        <div slot="footer" if:false={isLoaded}>
            <h2 class="WelcomeMsg">Hello {currentUserName} Welcome to Quote Creation process!</h2>
            <lightning-button variant="neutral" label="Submit" class="slds-m-left_x-small" onclick={selectedOpportunities}>
            </lightning-button>
        </div>
    </lightning-quick-action-panel>
 </template>
