<!-- sldsValidatorIgnore -->
<template>
    <div class="container">
    <lightning-card>
        <template lwc:if={showTable}>
        <h1><!-- sldsValidatorIgnoreNextLine -->
            <lightning-datatable
             data = {resultData} 
             columns= {columns}
             key-field="creditBureauId"
             onrowselection={handleRowSelection}
             selected-rows={selectedRows}
             max-row-selection='1'> 
            </lightning-datatable> 
        </h1> 
        <div slot="footer">
            <lightning-button variant="brand" label="Validate" title="Validate" onclick={handleValidate} class="slds-m-left_x-small"></lightning-button>
        </div>
       </template>
       <template lwc:if={showError}>
        <div style="min-height: 20rem;" class="slds-align_absolute-center">
            <div class="slds-box slds-theme_shade slds-theme_error">
                <p>
                  <strong>{errorMessage}</strong>
                </p>
              </div>
        </div>
       </template>
       
       <template lwc:if={showSpinner}>
        <div style="min-height: 20rem;">
          <lightning-spinner  variant="brand" alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
         </template>
      </lightning-card>
    </div>
</template>
