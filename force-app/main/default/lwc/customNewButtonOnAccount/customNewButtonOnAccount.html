<template>
    <template if:true={showForm}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container wide-modal">
                <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCancel}>
                                <lightning-icon icon-name="utility:close" alternative-text="Close" size="small" class="custom-close-icon"></lightning-icon>
                            </button>
                    <h2 class="slds-text-heading_medium">New Account: {recordTypeLabel}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-edit-form
                        object-api-name="Account"
                        record-type-id={recordTypeId}
                    >
<!-- Customer SECTION 1 -->
<template if:true={isCustomer}>
                            <div class="slds-box slds-m-around_medium">
                                <div class="slds-p-around_small slds-theme_shade">
                                <h3 class="slds-text-heading_small">Account Information</h3>
                            </div>
                                <div class="slds-grid slds-wrap">
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Name"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="VATNumber__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-combobox
    label="Country"
    value={selectCountryValue}
    options={CountryPicklistOptions}
    onchange={handleCountrySelect}>>
</lightning-combobox>
                                        <lightning-input-address class="lightningInputAddress" address-label="Billing Address" readonly = {isReadOnly} country-label="Billing Country" 
                                    street-label="Billing Street" city-label="Billing City" 
                                     province-label="Billing State/Province"
                                    postal-code-label="Billing Zip/Postal Code"
                                    onchange={handleAddressChange} show-address-lookup country-lookup-filter={selectCountryFilter}></lightning-input-address>
                                    </div>
                                    <div class="slds-hide">
                                        <lightning-input-field field-name="BillingStreet" value={billingAddress.street}></lightning-input-field>
                                        <lightning-input-field field-name="BillingCity" value={billingAddress.city}></lightning-input-field>
                                        <lightning-input-field field-name="BillingState" value={billingAddress.state}></lightning-input-field>
                                        <lightning-input-field field-name="BillingPostalCode" value={billingAddress.postalCode}></lightning-input-field>
                                        <lightning-input-field field-name="BillingCountry" value={billingAddress.country}></lightning-input-field>

                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="CompanyRegistrationNumber__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Type"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Customer_Number__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Email__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="CustomerID__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Phone"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Is_Deleted_From_Backbone__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Website"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="OwnerId"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Industry"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="CurrencyIsoCode" required></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="NumberOfEmployees"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="ParentId"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Fleet_Size__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Dealer_Account__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Credit_Rate__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="General_Information__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Credit_Assessment_Date__c"></lightning-input-field>
                                    </div>
                                </div>
                            </div>
                        </template>
<!-- Customer SECTION 2 -->

<template if:true={isCustomer}>
                <div class="slds-box slds-m-around_medium">
                        <div class="slds-p-around_small slds-theme_shade">
                    <h3 class="slds-text-heading_small">System Information</h3>
                        </div>
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                            <lightning-input-field field-name="Invoices_Fetched_On__c"></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small slds-m-top_medium">
                                <div class="slds-grid slds-gutters slds-align_absolute-center">
                                    <div class="slds-col slds-size_5-of-12">
                                        <span class="slds-form-element__label">Account Record Type</span>
                                    </div>
                                    <div class="slds-col slds-size_6-of-12">
                                        <lightning-formatted-text value={recordTypeLabel}></lightning-formatted-text>
                                    </div>
                                </div>
                            </div>
                    </div>
                </div>
            </template>
<!-- Dealer SECTION 1 -->
<template if:true={isDealer}>
                <div class="slds-box slds-m-around_medium">
                        <div class="slds-p-around_small slds-theme_shade">
                    <h3 class="slds-text-heading_small">Account Information</h3>
                        </div>
                    <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                    <lightning-input-field field-name="Name"></lightning-input-field>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="Customer_Number__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                            <lightning-input-field field-name="Branding__c"></lightning-input-field>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                                <lightning-input-field field-name="OwnerId"></lightning-input-field>
                                            </div>
                                                <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                                        <div class="slds-grid slds-gutters slds-align_absolute-center">
                                                            <div class="slds-col slds-size_1-of-2">
                                                                <span class="slds-form-element__label">Account Record Type</span>
                                                            </div>
                                                            <div class="slds-col slds-size_1-of-2">
                                                                <lightning-formatted-text value={recordTypeLabel}></lightning-formatted-text>
                                                            </div>
                                                        </div>
                                                    </div>
                                                <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                                        <lightning-input-field field-name="Phone"></lightning-input-field>
                                                    </div>
                                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                                            <lightning-input-field field-name="CurrencyIsoCode" required></lightning-input-field>
                                                        </div>
                                                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                                                <lightning-input-field field-name="ParentId"></lightning-input-field>
                                                            </div>
                                                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                                                    <lightning-input-field field-name="Is_Deleted_From_Backbone__c"></lightning-input-field>
                                                                </div>
                                                                <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                                                        <lightning-input-field field-name="Check_on_dealer_sales_person__c"></lightning-input-field>
                                                                    </div>


                    </div>
                </div>
            </template>
<template if:true={isDealer}>
                    <div class="slds-box slds-m-around_medium">
                            <div class="slds-p-around_small slds-theme_shade">
                        <h3 class="slds-text-heading_small">Address Information</h3>
                        </div>
                        <lightning-combobox
    label="Country"
    value={selectCountryValue}
    options={CountryPicklistOptions}
    onchange={handleCountrySelect}>>
</lightning-combobox>
                            <lightning-input-address class="lightningInputAddress" address-label="Billing Address" readonly = {isReadOnly} country-label="Billing Country" 
                                street-label="Billing Street" city-label="Billing City" 
                                 province-label="Billing State/Province" 
                                postal-code-label="Billing Zip/Postal Code"
                                onchange={handleAddressChange} show-address-lookup country-lookup-filter={selectCountryFilter}></lightning-input-address>
                    </div>
                    <div class="slds-hide">
                            <lightning-input-field field-name="BillingStreet" value={billingAddress.street}></lightning-input-field>
                            <lightning-input-field field-name="BillingCity" value={billingAddress.city}></lightning-input-field>
                            <lightning-input-field field-name="BillingState" value={billingAddress.state}></lightning-input-field>
                            <lightning-input-field field-name="BillingPostalCode" value={billingAddress.postalCode}></lightning-input-field>
                            <lightning-input-field field-name="BillingCountry" value={billingAddress.country}></lightning-input-field>

                        </div>
                </template>
<!-- Dealer SECTION 3 -->
<template if:true={isDealer}>
                        <div class="slds-box slds-m-around_medium">
                                <div class="slds-p-around_small slds-theme_shade">
                            <h3 class="slds-text-heading_small">System Information</h3>
                                </div>
                            <div class="slds-grid slds-wrap">
                                <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                    <lightning-input-field field-name="Invoices_Fetched_On__c"></lightning-input-field>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                        <lightning-input-field field-name="CompanyRegistrationNumber__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                            <lightning-input-field field-name="CustomerID__c"></lightning-input-field>
                                        </div>

                            </div>
                        </div>
                    </template>
<div class="slds-align_absolute-center slds-m-top_medium">
    <lightning-button label="Cancel" variant="neutral" class="slds-m-right_xx-small" onclick={handleCancel}></lightning-button>
    <lightning-button label="Save & New" variant="neutral" class="slds-m-right_xx-small" onclick={handleSaveAndNew}></lightning-button>
    <lightning-button label="Save" variant="brand" onclick={handleSave}></lightning-button>

</div>

<template if:true={showDuplicateAlert}>
        <div class={alertClass}>
            <div class="alert-header">
                <lightning-icon icon-name={alertIcon} variant={alertVariant} size="small"></lightning-icon>
                <span class="alert-title">{duplicateHeaderMessage}</span>
                <button class="close-btn" onclick={handleCloseAlert}>×</button>
            </div>
            <div class="alert-body">
                <p>This record looks like an existing record.<br />
                    Make sure to check any potential duplicate records before saving.</p>
                <a href="#" onclick={handleViewDuplicates}>View Duplicates</a>
            </div>
<template if:true={showDuplicateList}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!--  Top-right Close Button -->
            <button class="slds-button slds-modal__close slds-button_icon slds-button_icon-inverse" title="Close" onclick={closeDuplicateModal}>
                <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
            </button>
            <!-- Modal Header with Conditional Styling -->
                    <header class={modalHeadeComputedClass}>
                <h2 class="slds-text-heading_medium">View Duplicates</h2>
            </header>
 
            <!-- Modal Body -->
            <div class="slds-modal__content slds-p-around_medium">
                <p class={alertMessageComputedClass}>Use one of these records?</p>
                <template if:true={duplicateAccounts}>
                    <p> Total duplicates:{duplicateAccounts.length}</p>
                </template>
<template for:each={duplicateAccounts} for:item="acc">
<div key={acc.Id} class="slds-box slds-m-vertical_small">
                        
    <p><strong>Account Name:</strong> {acc.Name}</p>
    <p><strong>Customer Number (CMS ID):</strong> {acc.Customer_Number__c}</p>
                        <p><strong>Phone:</strong> {acc.Phone}</p>
                        <p><strong>Account Owner:</strong> {acc.Owner.Name}</p>
                        <p><strong>Billing Street:</strong> {acc.BillingStreet}</p>
                        <p><strong>Billing City:</strong> {acc.BillingCity}</p>
                        <p><strong>Billing State/Province:</strong> {acc.BillingState}</p>
                        <p><strong>Billing Zip/Postal Code:</strong> {acc.BillingPostalCode}</p>
                        <p><strong>Billing Country:</strong> {acc.BillingCountry}</p>
                        <a href="#" data-id={acc.Id} onclick={handleOpenRecord}>Open this Account</a>
                    </div>
                </template>
</div>
</div>
</section>

<!-- Modal Backdrop -->
<div class="slds-backdrop slds-backdrop_open"></div>
</template>
</div>
</template>
</lightning-record-edit-form>
</div>
</div>
</section>
<div class="slds-backdrop slds-backdrop_open"></div>
</template>
</template>
