<template>

    <!-- Loading Spinner -->
    <template if:true={isLoading}>
        <div class="loading-container">
            <lightning-spinner
                alternative-text="Loading"
                size="medium">
            </lightning-spinner>

            <div class="loading-message">
                Please wait while we load the Opportunity details...
            </div>
        </div>
    </template>


    <!-- Main Component -->
    <template if:false={isLoading}>

    <!-- ERROR -->
    <template if:true={error}>
        <div class="error-message">
            {error}
        </div>
    </template>
   
    <!-- MAIN -->
    <template if:true={showFields}>
        <lightning-record-edit-form object-api-name="Opportunity">
            <lightning-card>
                <!-- FORM GRID -->
                <div class="main-grid">
                    <!-- LEFT COLUMN -->
                    <div class="grid-column">
                        <!-- OWNER -->
                        <div class="field-wrapper">
                            <label class="custom-label">
Opportunity Owner
</label>

                            <div class="owner-container">
                                <lightning-input type="search" variant="label-hidden" placeholder="Search Ownery"
                                    value={selectedOwnerName} onchange={handleOwnerSearch}>
                                </lightning-input>
                                <!-- DROPDOWN -->
                                <template if:true={ownerOptions.length}>
                                    <div class="dropdown">
                                        <template for:each={ownerOptions} for:item="owner">
                                            <div key={owner.Id} class="dropdown-item" data-id={owner.Id}
                                                data-name={owner.Name} onclick={selectOwner}>
                                                {owner.Name}
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <!-- CUSTOMER ACCOUNT -->
                        <div class="field-wrapper">
                            <lightning-input-field field-name="Customer_Account__c" onchange={handleFieldChange}>
                            </lightning-input-field>
                        </div>


                        <!-- AMOUNT -->
                        <div class="field-wrapper">
                            <lightning-input-field field-name="Amount" onchange={handleFieldChange}>
                            </lightning-input-field>
                        </div>
                        <!-- Next Step Date -->
                        <template if:true={showNextStepField}>
                        <div class="field-wrapper">
                            <lightning-input-field field-name="Next_Step_Date__c" label="Next Step Date" onchange={handleFieldChange}>
                            </lightning-input-field>
                        </div>
                        </template> 
                         <lightning-messages></lightning-messages>
                        
                        <!-- Next Step -->
                        <template if:true={showNextStepField}>
                        <div class="field-wrapper">
                            <lightning-input-field field-name="NextStep" onchange={handleFieldChange}>
                            </lightning-input-field>
                        </div>
                       </template> 




                    </div>

                    

                    <!-- RIGHT COLUMN -->
                    <div class="grid-column">
                        <!-- STAGE -->
                        <div class="field-wrapper">
                            <lightning-combobox name="StageName" label="Stage" value={selectedStage}
                                options={stageOptions} onchange={handleStageChange}>
                            </lightning-combobox>
                        </div>

                        <!-- SUB STAGE -->
                        <template if:true={isLCVOpportunity}>
                            <div class="field-wrapper">
                                <lightning-combobox name="Sub_Stage__c" label="Sub Stage" value={selectedSubStage}
                                    options={subStageOptions} disabled={isSubStageDisabled}
                                    onchange={handleSubStageChange}>
                                </lightning-combobox>
                            </div>
                        </template>

                        <!-- LOST REASON -->
                        <div class="field-wrapper">
                            <lightning-combobox name="Lost_Reason__c" label="Lost Reason" value={selectedLostReason}
                                options={lostReasonOptions} disabled={isLostReasonDisabled}
                                onchange={handleLostReasonChange}>
                            </lightning-combobox>
                        </div>

                        <!-- REASON -->
                        <div class="field-wrapper">
                            <lightning-combobox name="Reason__c" label="Detail" value={selectedReason}
                                options={reasonOptions} disabled={isReasonDisabled} onchange={handleReasonChange}>
                            </lightning-combobox>
                        </div>

                        <!-- LOST TO -->
                        <div class="field-wrapper">
                            <lightning-combobox name="Finance_Houses__c" label="Lost To" value={selectedFinanceHouse}
                                options={financeHouseOptions} disabled={disableLostToField}
                                onchange={handleFinanceHouseChange}>
                            </lightning-combobox>
                            <template if:true={lostToHelpMessage}>
                                <div class="field-help-text">
                                    {lostToHelpMessage}
                                </div>
                            </template>
                        </div>

                        <!-- ADDITIONAL DETAILS -->
                        <div class="field-wrapper">
                            <lightning-input-field field-name="Additional_Details__c"
                                disabled={disableAdditionalDetails} onchange={handleFieldChange}>
                            </lightning-input-field>
                        </div>
                    </div>
                </div>
            </lightning-card>
        </lightning-record-edit-form>

        <!-- OPPORTUNITY LIST -->
        <lightning-card>
            <div class="opportunity-container">
                <div class="list-header">
                    OPPORTUNITY NAME
                </div>
                <template for:each={opportunities} for:item="opportunity">
                    <div key={opportunity.Id} class="opportunity-row">
                        {opportunity.Name}
                    </div>
                </template>
            </div>
        </lightning-card>

        <!-- BUTTONS -->
        <div class="button-section">
            <lightning-button label="Save" variant="brand" onclick={handleSave}>
            </lightning-button>
            <lightning-button label="Cancel" variant="neutral" onclick={handleCancel} class="slds-m-left_small">
            </lightning-button>
        </div>

        <!-- TOAST -->
        <template if:true={showToast}>
            <c-custom-toast message={toastMessage} variant={toastVariant} duration="4000">
            </c-custom-toast>
        </template>
    </template>
</template>
</template>

</template>
