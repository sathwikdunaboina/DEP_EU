<template>
    <lightning-card title={label.Selects_Contacts}>
      <template if:true={accountsWithContacts}>
        <template for:each={accountsWithContacts} for:item="account">
          <div key={account.Id} class="slds-box slds-m-bottom_medium">
            <h3 class="slds-text-heading_small slds-m-bottom_xx-small slds-text-title_bold">{account.Name}</h3>
            <template lwc:if={account.Contacts.length}>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
              <thead>
                <tr>
                  <th>{label.Select}</th>
                  <th>{label.Name}</th>
                  <th>{label.Email}</th>
                </tr>
              </thead>
              <tbody>
                
                  <template for:each={account.Contacts} for:item="contact">
                    <tr key={contact.Id}>
                      <td>
                        <lightning-input
                          type="checkbox"
                          data-id={contact.Id}
                          checked={contact.selected}
                          onchange={handleCheckboxChange}>
                        </lightning-input>
                      </td>
                      <td>{contact.Name}</td>
                      <td>{contact.Email}</td>
                    </tr>
                  </template>
               
                
              </tbody>
            </table>
          </template>
          <template lwc:else>
            
          <div class="slds-box slds-theme_alert-texture slds-theme_info slds-text-align_center slds-p-around_medium">
            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center slds-wrap">
             
              <div>
                <p class="slds-text-heading_small slds-m-bottom_xx-small">
                  <lightning-icon 
                  icon-name="standard:contact" 
                  alternative-text="No contacts" 
                  size="small"
                  class="slds-m-right_small">
                </lightning-icon>
                {label.No_Contacts_Available}</p>
                <p class="slds-text-body_regular">{label.This_account_doesn_t_have_any_related_contacts}</p>
              </div>
            </div>
          </div>
          
        </template>
           
          </div>
        </template>
      </template>
  
      <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading..."></lightning-spinner>
      </template>
  
      <template if:true={error}>
        <c-error-panel errors={error}></c-error-panel>
      </template>
    </lightning-card>
  </template>
